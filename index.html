<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>サイズ測定アプリ</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121417;
      color: #f3f5f8;
    }
    .app {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel {
      background: #1c2026;
      border: 1px solid #2d333d;
      border-radius: 12px;
      padding: 12px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    label.btn, button {
      appearance: none;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: #2b6cb0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    label.btn.secondary, button.secondary {
      background: #323842;
    }
    label.btn.active, button.active {
      background: #2f855a;
    }
    input[type="file"] {
      display: none;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }
    .input-group input, .input-group select {
      background: #121417;
      color: #fff;
      border: 1px solid #444c56;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      width: 92px;
    }
    .input-group select {
      width: auto;
    }
    .canvas-wrap {
      position: relative;
      width: 100%;
      min-height: 240px;
      background: #0d0f12;
      border: 1px dashed #3a424e;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      touch-action: none;
    }
    .placeholder {
      color: #9aa4b2;
      font-size: 14px;
      text-align: center;
      padding: 24px;
      line-height: 1.6;
    }
    .result-box {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }
    .stat {
      background: #121417;
      border: 1px solid #2b313b;
      border-radius: 10px;
      padding: 10px;
    }
    .stat-label {
      font-size: 12px;
      color: #9aa4b2;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      margin-top: 2px;
      color: #63b3ed;
    }
    .status {
      font-size: 12px;
      color: #a0aec0;
      margin-top: 8px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <div class="row">
        <label class="btn" for="photoInput">
          写真を選ぶ / 撮影
        </label>
        <input id="photoInput" type="file" accept="image/*" />

        <button id="modeRefBtn" class="secondary active" type="button">基準線（A-B）</button>
        <button id="modeMeasureBtn" class="secondary" type="button">測定線（C-D）</button>
        <button id="resetPtsBtn" class="secondary" type="button">点をリセット</button>
      </div>

      <div class="row" style="margin-top: 10px;">
        <div class="input-group">
          <span>基準の長さ:</span>
          <input id="refLengthInput" type="number" step="any" min="0.01" value="10" />
          <select id="unitSelect">
            <option value="cm" selected>cm</option>
            <option value="mm">mm</option>
          </select>
        </div>
      </div>

      <div class="result-box">
        <div class="stat">
          <div class="stat-label">基準線（A-B）ピクセル長</div>
          <div class="stat-value" id="refPxText">-</div>
        </div>
        <div class="stat">
          <div class="stat-label">測定サイズ（C-D）</div>
          <div class="stat-value" id="measuredText">-</div>
        </div>
      </div>

      <div class="status" id="statusText">「写真を選ぶ / 撮影」から画像を選択してください。</div>
    </div>

    <div class="panel">
      <div class="canvas-wrap" id="canvasWrap">
        <div class="placeholder" id="placeholder">
          まだ写真が読み込まれていません。<br />
          上の「写真を選ぶ / 撮影」をタップしてください。
        </div>
        <canvas id="canvas" style="display: none;"></canvas>
      </div>
    </div>
  </div>

  <script>
    const photoInput = document.getElementById('photoInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const placeholder = document.getElementById('placeholder');
    const statusText = document.getElementById('statusText');
    const refLengthInput = document.getElementById('refLengthInput');
    const unitSelect = document.getElementById('unitSelect');
    const refPxText = document.getElementById('refPxText');
    const measuredText = document.getElementById('measuredText');
    const modeRefBtn = document.getElementById('modeRefBtn');
    const modeMeasureBtn = document.getElementById('modeMeasureBtn');
    const resetPtsBtn = document.getElementById('resetPtsBtn');

    let img = new Image();
    let hasImage = false;
    let activeMode = 'ref'; // 'ref' or 'measure'
    let dragging = null; // { group: 'ref'|'measure', index: 0|1 }

    // 画像座標（0〜1の割合で保持するとリサイズ時もズレない）
    let refPts = [
      { x: 0.25, y: 0.5 },
      { x: 0.75, y: 0.5 }
    ];
    let measurePts = [
      { x: 0.3, y: 0.7 },
      { x: 0.7, y: 0.7 }
    ];

    function setMode(mode) {
      activeMode = mode;
      modeRefBtn.classList.toggle('active', mode === 'ref');
      modeMeasureBtn.classList.toggle('active', mode === 'measure');
      statusText.textContent = mode === 'ref'
        ? '基準線（A・B）の端点をドラッグして、既知の長さ（例：10cm）に合わせてください。'
        : '測定線（C・D）の端点をドラッグして、測りたい対象の両端に合わせます。';
      draw();
    }

    modeRefBtn.addEventListener('click', () => setMode('ref'));
    modeMeasureBtn.addEventListener('click', () => setMode('measure'));

    resetPtsBtn.addEventListener('click', () => {
      refPts = [{ x: 0.25, y: 0.5 }, { x: 0.75, y: 0.5 }];
      measurePts = [{ x: 0.3, y: 0.7 }, { x: 0.7, y: 0.7 }];
      draw();
      updateMeasurements();
    });

    refLengthInput.addEventListener('input', updateMeasurements);
    unitSelect.addEventListener('change', updateMeasurements);

    function loadImageFromFile(file) {
      if (!file) return;
      statusText.textContent = '写真を読み込み中...';

      const reader = new FileReader();
      reader.onload = function (e) {
        const nextImg = new Image();
        nextImg.onload = function () {
          img = nextImg;
          hasImage = true;
          placeholder.style.display = 'none';
          canvas.style.display = 'block';
          fitCanvasToContainer();
          draw();
          updateMeasurements();
          statusText.textContent = `読み込み完了（${img.naturalWidth} × ${img.naturalHeight} px）。A・Bを基準長さに合わせてください。`;
        };
        nextImg.onerror = function () {
          statusText.textContent = '画像の描画に失敗しました。別の写真でお試しください。';
        };
        nextImg.src = e.target.result;
      };
      reader.onerror = function () {
        statusText.textContent = 'ファイルの読み込みに失敗しました。';
      };
      reader.readAsDataURL(file);
    }

    photoInput.addEventListener('change', function (e) {
      const file = e.target.files && e.target.files[0];
      loadImageFromFile(file);
      // 同じ写真を連続で選び直せるようにリセット
      e.target.value = '';
    });

    function fitCanvasToContainer() {
      if (!hasImage) return;
      const wrapWidth = Math.max(240, canvas.parentElement.clientWidth - 4);
      const scale = wrapWidth / img.naturalWidth;
      canvas.width = Math.round(wrapWidth);
      canvas.height = Math.max(150, Math.round(img.naturalHeight * scale));
    }

    window.addEventListener('resize', () => {
      if (!hasImage) return;
      fitCanvasToContainer();
      draw();
      updateMeasurements();
    });

    function getCanvasPos(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function distPx(p1, p2) {
      const x1 = p1.x * canvas.width;
      const y1 = p1.y * canvas.height;
      const x2 = p2.x * canvas.width;
      const y2 = p2.y * canvas.height;
      return Math.hypot(x2 - x1, y2 - y1);
    }

    function updateMeasurements() {
      if (!hasImage) return;
      const refPx = distPx(refPts[0], refPts[1]);
      const measPx = distPx(measurePts[0], measurePts[1]);
      const refReal = parseFloat(refLengthInput.value);
      const unit = unitSelect.value;

      refPxText.textContent = `${refPx.toFixed(1)} px`;

      if (refPx > 0 && !isNaN(refReal) && refReal > 0) {
        const value = (measPx / refPx) * refReal;
        measuredText.textContent = `${value.toFixed(2)} ${unit}`;
      } else {
        measuredText.textContent = '-';
      }
    }

    function drawLineWithHandles(pts, color, labels) {
      const p0 = { x: pts[0].x * canvas.width, y: pts[0].y * canvas.height };
      const p1 = { x: pts[1].x * canvas.width, y: pts[1].y * canvas.height };

      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();

      [p0, p1].forEach((pt, idx) => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(labels[idx], pt.x + 14, pt.y - 8);
      });
      ctx.restore();
    }

    function draw() {
      if (!hasImage) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      drawLineWithHandles(refPts, '#38bdf8', ['A', 'B']);
      drawLineWithHandles(measurePts, '#4ade80', ['C', 'D']);
    }

    function findHitPoint(pos) {
      const hitRadius = 24;
      const groups = [
        { name: 'ref', pts: refPts },
        { name: 'measure', pts: measurePts }
      ];
      // 現在選択中のモードを優先
      groups.sort((a, b) => (a.name === activeMode ? -1 : b.name === activeMode ? 1 : 0));

      for (const g of groups) {
        for (let i = 0; i < g.pts.length; i++) {
          const px = g.pts[i].x * canvas.width;
          const py = g.pts[i].y * canvas.height;
          if (Math.hypot(pos.x - px, pos.y - py) <= hitRadius) {
            return { group: g.name, index: i };
          }
        }
      }
      return null;
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (!hasImage) return;
      const pos = getCanvasPos(e.clientX, e.clientY);
      const hit = findHitPoint(pos);
      if (hit) {
        dragging = hit;
        canvas.setPointerCapture(e.pointerId);
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!dragging || !hasImage) return;
      const pos = getCanvasPos(e.clientX, e.clientY);
      const nx = Math.max(0, Math.min(1, pos.x / canvas.width));
      const ny = Math.max(0, Math.min(1, pos.y / canvas.height));

      if (dragging.group === 'ref') {
        refPts[dragging.index] = { x: nx, y: ny };
      } else {
        measurePts[dragging.index] = { x: nx, y: ny };
      }
      draw();
      updateMeasurements();
    });

    function endDrag() {
      dragging = null;
    }

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
  </script>
</body>
</html>
