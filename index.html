<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>サイズ測定アプリ-rev1</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121417;
      color: #f3f5f8;
    }
    .app {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    header.sticky-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: #1c2026;
      border: 1px solid #2d333d;
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }
    .app-title {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel {
      background: #1c2026;
      border: 1px solid #2d333d;
      border-radius: 12px;
      padding: 12px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .row + .row {
      margin-top: 8px;
    }
    label.btn, button {
      appearance: none;
      border: none;
      border-radius: 9px;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: #2b6cb0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    button.secondary, label.btn.secondary { background: #323842; }
    button.success { background: #2f855a; }
    button.share-btn { background: #3182ce; }
    button.danger { background: #9b2c2c; }
    button.active { outline: 2px solid #63b3ed; background: #2c5282; }
    button.small { padding: 6px 10px; font-size: 12px; }
    input[type="file"] { display: none; }

    .field {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
    }
    .field input, .field select {
      background: #121417;
      color: #fff;
      border: 1px solid #444c56;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 14px;
    }
    .field input[type="number"] { width: 72px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .stat {
      background: #121417;
      border: 1px solid #2b313b;
      border-radius: 9px;
      padding: 6px 8px;
    }
    .stat-label { font-size: 11px; color: #9aa4b2; }
    .stat-val { font-size: 15px; font-weight: 700; color: #63b3ed; margin-top: 1px; }

    .canvas-wrap {
      position: relative;
      width: 100%;
      min-height: 260px;
      background: #0d0f12;
      border: 1px dashed #3a424e;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      max-width: 100%;
      touch-action: none;
    }
    .placeholder {
      color: #9aa4b2;
      font-size: 13px;
      text-align: center;
      padding: 24px;
      line-height: 1.6;
    }

    .line-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
      margin-top: 8px;
    }
    .line-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #121417;
      border: 1px solid #2b313b;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
    }
    .line-item.unlocked {
      border-color: #4ade80;
      background: #16221c;
    }
    .line-item.locked {
      opacity: 0.72;
    }
    .line-main {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 700;
    }
    .badge.active-badge { background: #2f855a; color: #fff; }
    .badge.lock-badge { background: #2d333d; color: #cbd5e0; }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
    }
    .dot.locked-dot { background: #718096; }

    textarea.output-box {
      width: 100%;
      min-height: 110px;
      background: #121417;
      color: #e2e8f0;
      border: 1px solid #3a424e;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-top: 8px;
    }
    .status {
      font-size: 12px;
      color: #a0aec0;
      margin-top: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="sticky-header" id="appHeader">
      <div class="app-title">
        <span>サイズ測定アプリ-rev1</span>
      </div>

      <div class="row">
        <label class="btn" for="photoInput">写真を選ぶ / 撮影</label>
        <input id="photoInput" type="file" accept="image/*" />

        <button id="toolRefBtn" class="secondary" type="button">基準線 (A-B)</button>
        <button id="toolMeasureBtn" class="secondary active" type="button">最新線操作</button>
        <button id="toolPanBtn" class="secondary" type="button">画面移動 (パン)</button>
      </div>

      <div class="row">
        <div class="field">
          <span>基準長さ:</span>
          <input id="refRealInput" type="number" step="any" min="0.001" value="4" />
          <select id="unitSelect">
            <option value="cm" selected>cm</option>
            <option value="mm">mm</option>
          </select>
        </div>

        <button id="addLineBtn" class="success" type="button">＋ 測定線を1本追加</button>
        <button id="resetAllBtn" class="secondary" type="button">全リセット</button>
      </div>

      <div class="row">
        <span class="field">拡大/縮小:</span>
        <button class="secondary small zoom-btn active" data-zoom="1" type="button">1x</button>
        <button class="secondary small zoom-btn" data-zoom="2" type="button">2x</button>
        <button class="secondary small zoom-btn" data-zoom="3" type="button">3x</button>
        <button id="zoomResetBtn" class="secondary small" type="button">表示リセット</button>
      </div>

      <div class="stats-grid">
        <div class="stat">
          <div class="stat-label">基準線 (A-B)</div>
          <div class="stat-val" id="refPxStat">-</div>
        </div>
        <div class="stat">
          <div class="stat-label">測定本数</div>
          <div class="stat-val" id="countStat">0 本</div>
        </div>
        <div class="stat">
          <div class="stat-label">平均サイズ</div>
          <div class="stat-val" id="avgStat">-</div>
        </div>
      </div>

      <div class="status" id="statusText">写真を選択してください。基準線A-Bを合わせたら「＋ 測定線を1本追加」を押してください。</div>
    </header>

    <div class="panel">
      <div class="canvas-wrap" id="canvasWrap">
        <div class="placeholder" id="placeholder">
          写真がまだ読み込まれていません。<br />
          「写真を選ぶ / 撮影」から画像を選択してください。
        </div>
        <canvas id="canvas" style="display: none;"></canvas>
      </div>
    </div>

    <div class="panel">
      <strong>測定線一覧（最新1本のみ操作可・過去線はロック保護）</strong>
      <div class="line-list" id="lineList"></div>
    </div>

    <div class="panel">
      <div class="row">
        <strong>結果出力</strong>
        <button id="shareResultBtn" class="share-btn small" type="button">共有する (LINE・メール等)</button>
        <button id="copyTextBtn" class="secondary small" type="button">テキストをコピー</button>
        <button id="downloadCsvBtn" class="secondary small" type="button">CSV保存</button>
        <button id="downloadImgBtn" class="secondary small" type="button">測定画像保存</button>
      </div>
      <textarea id="outputArea" class="output-box" readonly placeholder="測定を行うとここに結果が出力されます。"></textarea>
    </div>
  </div>

  <script>
    const photoInput = document.getElementById('photoInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const canvasWrap = document.getElementById('canvasWrap');
    const placeholder = document.getElementById('placeholder');
    const statusText = document.getElementById('statusText');

    const refRealInput = document.getElementById('refRealInput');
    const unitSelect = document.getElementById('unitSelect');
    const toolRefBtn = document.getElementById('toolRefBtn');
    const toolMeasureBtn = document.getElementById('toolMeasureBtn');
    const toolPanBtn = document.getElementById('toolPanBtn');
    const addLineBtn = document.getElementById('addLineBtn');
    const resetAllBtn = document.getElementById('resetAllBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');
    const zoomBtns = document.querySelectorAll('.zoom-btn');

    const refPxStat = document.getElementById('refPxStat');
    const countStat = document.getElementById('countStat');
    const avgStat = document.getElementById('avgStat');
    const lineListEl = document.getElementById('lineList');
    const outputArea = document.getElementById('outputArea');

    const shareResultBtn = document.getElementById('shareResultBtn');
    const copyTextBtn = document.getElementById('copyTextBtn');
    const downloadCsvBtn = document.getElementById('downloadCsvBtn');
    const downloadImgBtn = document.getElementById('downloadImgBtn');

    let img = new Image();
    let hasImage = false;

    // 'ref' | 'measure' | 'pan'
    let activeTool = 'ref';

    // ズーム・パン（画像正規化座標 0..1 基準）
    let zoom = 1;
    let viewCenter = { x: 0.5, y: 0.5 };

    // 基準線 (正規化座標 0..1)
    let refLine = {
      p0: { x: 0.25, y: 0.35 },
      p1: { x: 0.45, y: 0.35 }
    };

    // 測定線配列: [{ id, label, p0:{x,y}, p1:{x,y} }]
    let measureLines = [];
    let activeLineId = null;
    let nextLineNum = 1;

    let dragState = null;

    function getEditableLine() {
      if (!measureLines.length) return null;
      if (activeLineId !== null) {
        const found = measureLines.find(l => l.id === activeLineId);
        if (found) return found;
      }
      return measureLines[measureLines.length - 1];
    }

    function setTool(tool) {
      activeTool = tool;
      toolRefBtn.classList.toggle('active', tool === 'ref');
      toolMeasureBtn.classList.toggle('active', tool === 'measure');
      toolPanBtn.classList.toggle('active', tool === 'pan');

      if (tool === 'ref') {
        statusText.textContent = '基準線(A-B)モード：AとBのみ動かせます。測定線はすべてロック中です。';
      } else if (tool === 'measure') {
        const target = getEditableLine();
        statusText.textContent = target
          ? `最新線操作モード：${target.label} のみ動かせます。基準線と他の測定線はロック中です。`
          : '測定線がありません。「＋ 測定線を1本追加」を押してください。';
      } else {
        statusText.textContent = '画面移動モード：ドラッグで拡大表示中の位置を移動できます。全線はロック中です。';
      }
      render();
    }

    toolRefBtn.addEventListener('click', () => setTool('ref'));
    toolMeasureBtn.addEventListener('click', () => setTool('measure'));
    toolPanBtn.addEventListener('click', () => setTool('pan'));

    function clampCenter(c, z) {
      const half = 0.5 / z;
      return {
        x: Math.max(half, Math.min(1 - half, c.x)),
        y: Math.max(half, Math.min(1 - half, c.y))
      };
    }

    function applyCanvasSize() {
      if (!hasImage) return;
      const wrapW = Math.max(260, canvasWrap.clientWidth - 4);
      const ratio = img.naturalHeight / img.naturalWidth;
      const w = Math.round(wrapW);
      const h = Math.max(180, Math.round(wrapW * ratio));

      canvas.width = w;
      canvas.height = h;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
    }

    function setZoom(newZoom) {
      zoom = Math.max(1, Math.min(6, newZoom));
      if (zoom === 1) {
        viewCenter = { x: 0.5, y: 0.5 };
      } else {
        viewCenter = clampCenter(viewCenter, zoom);
      }
      zoomBtns.forEach(btn => {
        const z = parseFloat(btn.dataset.zoom);
        btn.classList.toggle('active', Math.abs(z - zoom) < 0.01);
      });
      if (hasImage) {
        applyCanvasSize();
        render();
      }
    }

    zoomBtns.forEach(btn => {
      btn.addEventListener('click', () => setZoom(parseFloat(btn.dataset.zoom)));
    });

    zoomResetBtn.addEventListener('click', () => {
      viewCenter = { x: 0.5, y: 0.5 };
      setZoom(1);
    });

    function addMeasureLine() {
      if (!hasImage) {
        statusText.textContent = '先に写真を選んでください。';
        return;
      }
      const id = nextLineNum++;
      const offset = ((id - 1) % 6) * 0.03;
      const cx = viewCenter.x;
      const cy = viewCenter.y;
      const halfLen = 0.12 / zoom;

      const line = {
        id,
        label: `#${id}`,
        p0: {
          x: Math.max(0.05, Math.min(0.95, cx - halfLen + offset)),
          y: Math.max(0.05, Math.min(0.95, cy + offset))
        },
        p1: {
          x: Math.max(0.05, Math.min(0.95, cx + halfLen + offset)),
          y: Math.max(0.05, Math.min(0.95, cy + offset))
        }
      };
      measureLines.push(line);
      activeLineId = id;
      setTool('measure');
      updateAll();
    }

    addLineBtn.addEventListener('click', addMeasureLine);

    resetAllBtn.addEventListener('click', () => {
      refLine = { p0: { x: 0.25, y: 0.35 }, p1: { x: 0.45, y: 0.35 } };
      measureLines = [];
      activeLineId = null;
      nextLineNum = 1;
      viewCenter = { x: 0.5, y: 0.5 };
      setZoom(1);
      updateAll();
    });

    refRealInput.addEventListener('input', updateAll);
    unitSelect.addEventListener('change', updateAll);

    photoInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      statusText.textContent = '写真を読み込み中...';

      const reader = new FileReader();
      reader.onload = (ev) => {
        const nextImg = new Image();
        nextImg.onload = () => {
          img = nextImg;
          hasImage = true;
          placeholder.style.display = 'none';
          canvas.style.display = 'block';
          viewCenter = { x: 0.5, y: 0.5 };
          zoom = 1;
          zoomBtns.forEach(btn => btn.classList.toggle('active', parseFloat(btn.dataset.zoom) === 1));
          applyCanvasSize();
          updateAll();
          statusText.textContent = `読み込み完了（${img.naturalWidth}×${img.naturalHeight}px）。基準線A-Bを合わせ、「＋ 測定線を1本追加」を押してください。`;
        };
        nextImg.src = ev.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    window.addEventListener('resize', () => {
      if (!hasImage) return;
      applyCanvasSize();
      render();
    });

    function getViewportBounds() {
      const span = 1 / zoom;
      const c = clampCenter(viewCenter, zoom);
      return {
        minX: c.x - span / 2,
        maxX: c.x + span / 2,
        minY: c.y - span / 2,
        maxY: c.y + span / 2,
        span
      };
    }

    function canvasPxToNorm(cx, cy) {
      const b = getViewportBounds();
      return {
        x: b.minX + (cx / canvas.width) * b.span,
        y: b.minY + (cy / canvas.height) * b.span
      };
    }

    function normToCanvasPx(nx, ny) {
      const b = getViewportBounds();
      return {
        x: ((nx - b.minX) / b.span) * canvas.width,
        y: ((ny - b.minY) / b.span) * canvas.height
      };
    }

    function calcRealPx(p0, p1) {
      if (!hasImage) return 0;
      const dx = (p1.x - p0.x) * img.naturalWidth;
      const dy = (p1.y - p0.y) * img.naturalHeight;
      return Math.hypot(dx, dy);
    }

    function calcMeasuredValue(line) {
      const refPx = calcRealPx(refLine.p0, refLine.p1);
      const linePx = calcRealPx(line.p0, line.p1);
      const refReal = parseFloat(refRealInput.value);
      if (refPx <= 0 || isNaN(refReal) || refReal <= 0) return null;
      return (linePx / refPx) * refReal;
    }

    function drawCrosshair(x, y, color, editable) {
      const arm = editable ? 13 : 9;
      ctx.save();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = editable ? 4.5 : 3;
      ctx.beginPath();
      ctx.moveTo(x - arm, y);
      ctx.lineTo(x + arm, y);
      ctx.moveTo(x, y - arm);
      ctx.lineTo(x, y + arm);
      ctx.stroke();

      ctx.strokeStyle = color;
      ctx.lineWidth = editable ? 2.5 : 1.8;
      ctx.beginPath();
      ctx.moveTo(x - arm, y);
      ctx.lineTo(x + arm, y);
      ctx.moveTo(x, y - arm);
      ctx.lineTo(x, y + arm);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y, editable ? 2 : 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawLine(p0Norm, p1Norm, color, labels, editable, alpha = 1) {
      const a = normToCanvasPx(p0Norm.x, p0Norm.y);
      const b = normToCanvasPx(p1Norm.x, p1Norm.y);

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = editable ? 3 : 2;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();

      [a, b].forEach((pt, idx) => {
        drawCrosshair(pt.x, pt.y, color, editable);

        ctx.fillStyle = '#ffffff';
        ctx.font = editable ? 'bold 12px sans-serif' : '11px sans-serif';
        ctx.fillText(labels[idx], pt.x + 14, pt.y - 8);
      });
      ctx.restore();
    }

    function render() {
      if (!hasImage) return;
      const b = getViewportBounds();
      const sx = b.minX * img.naturalWidth;
      const sy = b.minY * img.naturalHeight;
      const sw = b.span * img.naturalWidth;
      const sh = b.span * img.naturalHeight;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

      const refEditable = activeTool === 'ref';
      drawLine(refLine.p0, refLine.p1, '#38bdf8', ['A', 'B'], refEditable, refEditable ? 1 : 0.55);

      const editableLine = getEditableLine();
      measureLines.forEach((line) => {
        const isEditable = activeTool === 'measure' && editableLine && line.id === editableLine.id;
        drawLine(
          line.p0,
          line.p1,
          isEditable ? '#4ade80' : '#94a3b8',
          [`${line.label}a`, `${line.label}b`],
          isEditable,
          isEditable ? 1 : 0.55
        );
      });
    }

    function findHitEditableHandle(cx, cy) {
      const hitRadius = 24;

      if (activeTool === 'ref') {
        const pts = [refLine.p0, refLine.p1];
        for (let i = 0; i < 2; i++) {
          const pt = normToCanvasPx(pts[i].x, pts[i].y);
          if (Math.hypot(cx - pt.x, cy - pt.y) <= hitRadius) {
            return { type: 'ref', index: i };
          }
        }
      } else if (activeTool === 'measure') {
        const target = getEditableLine();
        if (target) {
          const pts = [target.p0, target.p1];
          for (let i = 0; i < 2; i++) {
            const pt = normToCanvasPx(pts[i].x, pts[i].y);
            if (Math.hypot(cx - pt.x, cy - pt.y) <= hitRadius) {
              return { type: 'measure', lineId: target.id, index: i };
            }
          }
        }
      }
      return null;
    }

    function getPointerCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (!hasImage) return;
      const pos = getPointerCanvasPos(e);

      if (activeTool === 'pan') {
        dragState = { type: 'pan', lastNorm: canvasPxToNorm(pos.x, pos.y) };
        canvas.setPointerCapture(e.pointerId);
        return;
      }

      const hit = findHitEditableHandle(pos.x, pos.y);
      if (hit) {
        dragState = hit;
        canvas.setPointerCapture(e.pointerId);
      } else if (zoom > 1) {
        dragState = { type: 'pan', lastNorm: canvasPxToNorm(pos.x, pos.y) };
        canvas.setPointerCapture(e.pointerId);
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!dragState || !hasImage) return;
      const pos = getPointerCanvasPos(e);
      const norm = canvasPxToNorm(pos.x, pos.y);

      if (dragState.type === 'pan') {
        const dx = dragState.lastNorm.x - norm.x;
        const dy = dragState.lastNorm.y - norm.y;
        viewCenter = clampCenter({ x: viewCenter.x + dx, y: viewCenter.y + dy }, zoom);
        dragState.lastNorm = canvasPxToNorm(pos.x, pos.y);
        render();
        return;
      }

      const nx = Math.max(0, Math.min(1, norm.x));
      const ny = Math.max(0, Math.min(1, norm.y));

      if (dragState.type === 'ref' && activeTool === 'ref') {
        if (dragState.index === 0) refLine.p0 = { x: nx, y: ny };
        else refLine.p1 = { x: nx, y: ny };
      } else if (dragState.type === 'measure' && activeTool === 'measure') {
        const target = getEditableLine();
        if (target && target.id === dragState.lineId) {
          if (dragState.index === 0) target.p0 = { x: nx, y: ny };
          else target.p1 = { x: nx, y: ny };
        }
      }
      updateAll();
    });

    function stopDrag() {
      dragState = null;
    }
    canvas.addEventListener('pointerup', stopDrag);
    canvas.addEventListener('pointercancel', stopDrag);

    function renderLineListAndOutput() {
      const unit = unitSelect.value;
      const refPx = calcRealPx(refLine.p0, refLine.p1);
      const refReal = parseFloat(refRealInput.value);
      refPxStat.textContent = hasImage ? `${refPx.toFixed(1)}px` : '-';

      const editableLine = getEditableLine();
      lineListEl.innerHTML = '';
      const validValues = [];
      const linesText = [];

      measureLines.forEach((line) => {
        const val = calcMeasuredValue(line);
        const px = calcRealPx(line.p0, line.p1);
        if (val !== null) {
          validValues.push(val);
          linesText.push(`${line.label}: ${val.toFixed(2)} ${unit} (${px.toFixed(1)}px)`);
        } else {
          linesText.push(`${line.label}: ${px.toFixed(1)}px`);
        }

        const isUnlocked = activeTool === 'measure' && editableLine && line.id === editableLine.id;
        const item = document.createElement('div');
        item.className = 'line-item ' + (isUnlocked ? 'unlocked' : 'locked');

        const main = document.createElement('div');
        main.className = 'line-main';
        main.innerHTML = `
          <span class="dot ${isUnlocked ? '' : 'locked-dot'}"></span>
          <strong>${line.label}</strong>
          <span>${val !== null ? `${val.toFixed(2)} ${unit}` : `${px.toFixed(1)} px`}</span>
          <span class="badge ${isUnlocked ? 'active-badge' : 'lock-badge'}">${isUnlocked ? '操作可' : 'ロック中'}</span>
        `;

        const rightActions = document.createElement('div');
        rightActions.style.display = 'flex';
        rightActions.style.gap = '6px';

        if (!isUnlocked) {
          const unlockBtn = document.createElement('button');
          unlockBtn.className = 'secondary small';
          unlockBtn.type = 'button';
          unlockBtn.textContent = 'この線を調整';
          unlockBtn.addEventListener('click', () => {
            activeLineId = line.id;
            setTool('measure');
            updateAll();
          });
          rightActions.appendChild(unlockBtn);
        }

        const delBtn = document.createElement('button');
        delBtn.className = 'danger small';
        delBtn.type = 'button';
        delBtn.textContent = '削除';
        delBtn.addEventListener('click', () => {
          measureLines = measureLines.filter(l => l.id !== line.id);
          if (activeLineId === line.id) {
            activeLineId = measureLines.length ? measureLines[measureLines.length - 1].id : null;
          }
          updateAll();
        });
        rightActions.appendChild(delBtn);

        item.appendChild(main);
        item.appendChild(rightActions);
        lineListEl.appendChild(item);
      });

      countStat.textContent = `${measureLines.length} 本`;

      if (validValues.length > 0) {
        const sum = validValues.reduce((a, b) => a + b, 0);
        const avg = sum / validValues.length;
        const min = Math.min(...validValues);
        const max = Math.max(...validValues);
        avgStat.textContent = `${avg.toFixed(2)} ${unit}`;

        outputArea.value = [
          `[サイズ測定アプリ-rev1]`,
          `基準: ${refReal} ${unit} (${refPx.toFixed(1)} px)`,
          `本数: ${validValues.length} 本 / 平均: ${avg.toFixed(2)} ${unit} (最小 ${min.toFixed(2)} / 最大 ${max.toFixed(2)} ${unit})`,
          '---',
          ...linesText
        ].join('\n');
      } else {
        avgStat.textContent = '-';
        outputArea.value = measureLines.length ? linesText.join('\n') : '';
      }
    }

    function updateAll() {
      render();
      renderLineListAndOutput();
    }

    shareResultBtn.addEventListener('click', async () => {
      if (!outputArea.value) return;
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'サイズ測定アプリ-rev1 結果',
            text: outputArea.value
          });
          statusText.textContent = '共有メニューを開きました。';
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }
      try {
        await navigator.clipboard.writeText(outputArea.value);
        statusText.textContent = '共有非対応環境のため結果をコピーしました。LINEやメールに貼り付けてください。';
      } catch {
        outputArea.select();
        document.execCommand('copy');
        statusText.textContent = '結果を選択しました。コピーして貼り付けてください。';
      }
    });

    copyTextBtn.addEventListener('click', async () => {
      if (!outputArea.value) return;
      try {
        await navigator.clipboard.writeText(outputArea.value);
        statusText.textContent = '測定結果をクリップボードにコピーしました。';
      } catch {
        outputArea.select();
        document.execCommand('copy');
        statusText.textContent = '測定結果を選択しました（コピーしてください）。';
      }
    });

    downloadCsvBtn.addEventListener('click', () => {
      if (!measureLines.length) return;
      const unit = unitSelect.value;
      const rows = [['No', 'Label', `Size(${unit})`, 'Pixels']];
      measureLines.forEach((line, i) => {
        const val = calcMeasuredValue(line);
        const px = calcRealPx(line.p0, line.p1).toFixed(1);
        rows.push([i + 1, line.label, val !== null ? val.toFixed(2) : '', px]);
      });
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'size_measurement_rev1.csv';
      a.click();
      URL.revokeObjectURL(url);
    });

    downloadImgBtn.addEventListener('click', () => {
      if (!hasImage) return;
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'measured_photo_rev1.png';
      a.click();
    });
  </script>
</body>
</html>
